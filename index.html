<video src="videos/reel1.mp4"><video<!DOCTYPE html>
  <video src="reel1.mp4" controls autoplay loop muted></video>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reels App</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial;
  overflow: hidden;
}

.reels-container {
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.reel {
  position: relative;
  height: 100vh;
  scroll-snap-align: start;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.actions {
  position: absolute;
  right: 10px;
  bottom: 100px;
  color: white;
  text-align: center;
}

.actions button {
  display: block;
  margin: 12px 0;
  background: none;
  border: none;
  color: white;
  font-size: 22px;
}

.username {
  position: absolute;
  bottom: 30px;
  left: 10px;
  color: white;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="reels-container">

  <!-- Reel 1 -->
  <div class="reel">
    <video src="reel1.mp4" muted loop></video>

    <div class="actions">
      <button onclick="like(this)">❤️ <span>0</span></button>
      <button>💬</button>
      <button>🔗</button>
    </div>

    <div class="username">@user1</div>
  </div>

  <!-- Reel 2 -->
  <div class="reel">
    <video src="reel2.mp4" muted loop></video>

    <div class="actions">
      <button onclick="like(this)">❤️ <span>0</span></button>
      <button>💬</button>
      <button>🔗</button>
    </div>

    <div class="username">@user2</div>
  </div>

</div>

<script>
// Like button
function like(btn) {
  let count = btn.querySelector("span");
  count.innerText = parseInt(count.innerText) + 1;
}

// Auto play only visible video
const videos = document.querySelectorAll("video");

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.play();
    } else {
      entry.target.pause();
    }
  });
}, { threshold: 0.6 });

videos.forEach(video => observer.observe(video));
</script>

</body>
</html>
